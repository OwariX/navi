<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>hello, world</title>
<style>
:root{--bg:#060608;--fg:#d9d4c7;--red:#ff2a4a;--cyan:#7fe7ff;--mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font:14px/1.6 var(--mono);overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%}
.scan{position:fixed;inset:0;pointer-events:none;z-index:5;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px)}
main{position:fixed;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
pre{font:clamp(7px,1.6vw,14px)/1.12 var(--mono);color:var(--red);white-space:pre;
  text-shadow:2px 0 color-mix(in srgb,var(--cyan) 55%,transparent),-2px 0 color-mix(in srgb,var(--red) 40%,transparent)}
.wire{margin-top:14px;letter-spacing:.6em;color:color-mix(in srgb,var(--fg) 55%,transparent);font-size:11px}
h1{margin-top:38px;font-weight:400;font-size:clamp(26px,6vw,64px);letter-spacing:.3em;padding-left:.3em;position:relative}
h1::before,h1::after{content:attr(data-text);position:absolute;top:0;left:0;width:100%;overflow:hidden;pointer-events:none}
h1::before{color:var(--red);left:2px;animation:g1 3.1s infinite steps(1)}
h1::after{color:var(--cyan);left:-2px;animation:g2 2.4s infinite steps(1)}
@keyframes g1{0%,88%,100%{clip-path:inset(100% 0 0 0)}89%{clip-path:inset(15% 0 55% 0)}92%{clip-path:inset(60% 0 10% 0)}95%{clip-path:inset(35% 0 40% 0)}}
@keyframes g2{0%,82%,100%{clip-path:inset(100% 0 0 0)}83%{clip-path:inset(70% 0 5% 0)}87%{clip-path:inset(5% 0 80% 0)}}
.line{margin-top:18px;color:var(--red);letter-spacing:.4em;font-size:12px;min-height:1.6em;text-transform:uppercase;max-width:min(880px,92vw);overflow-wrap:anywhere}
.line i{display:inline-block;width:.6em;height:1em;background:var(--red);vertical-align:-2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.foot{position:fixed;bottom:18px;left:0;right:0;z-index:3;text-align:center;font-size:10.5px;letter-spacing:.2em;color:color-mix(in srgb,var(--fg) 40%,transparent)}
.foot b{font-weight:400;color:var(--cyan)}
#con{position:fixed;top:18px;right:22px;z-index:6;background:none;border:1px solid color-mix(in srgb,var(--red) 35%,transparent);color:color-mix(in srgb,var(--fg) 60%,transparent);
  font:10.5px var(--mono);letter-spacing:.25em;padding:6px 12px;cursor:pointer}
#con:hover{border-color:var(--red);color:var(--fg)}
.clock{position:fixed;top:18px;left:22px;z-index:3;font-size:11px;letter-spacing:.25em;color:var(--red);text-align:left}
.clock span{display:block;color:var(--fg);margin:3px 0 10px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="scan"></div>
<div class="clock">PRESENT DAY<span id="d">----.--.--</span>PRESENT TIME<span id="t">--:--:--</span></div>
<button id="con">CONNECT // SOUND</button>
<main>
  <pre id="logo"></pre>
  <div class="wire">──◉────◎────◉──</div>
  <h1 data-text="hello, world">hello, world</h1>
  <div class="line" id="line"><i></i></div>
</main>
<div class="foot">built by <b>THE KNIGHTS</b> · architect · adversary · ledger · scribe · warden · a NAVI demo</div>
<script>
'use strict';
// NAVI's palette comes along in the link (?a=accent&b=accent2&bg=&fg=, hex only); the page keeps its own otherwise
const Q = new URLSearchParams(location.search), HEXQ = k => /^[0-9a-f]{6}$/i.test(Q.get(k) || '') ? '#' + Q.get(k) : '';
for (const [k, v] of [['a', '--red'], ['b', '--cyan'], ['bg', '--bg'], ['fg', '--fg']]) if (HEXQ(k)) document.documentElement.style.setProperty(v, HEXQ(k));
const css = getComputedStyle(document.documentElement), tri = v => { const n = parseInt(css.getPropertyValue(v).trim().slice(1), 16); return `${n >> 16 & 255},${n >> 8 & 255},${n & 255}`; };
const RED = tri('--red'), FG = tri('--fg'), BG = tri('--bg');
const L = {N:['██▄    ██','███▄   ██','██ ▀█▄ ██','██   ▀███','██     ██'],A:['  ▄███▄  ',' ██▀ ▀██ ',' ███████ ',' ██   ██ ',' ██   ██ '],
           V:['██     ██',' ██   ██ ','  ██ ██  ','   ███   ','    █    '],I:['██','██','██','██','██']};
const LINES = [0,1,2,3,4].map(r => ['N','A','V','I'].map(c => L[c][r]).join('   '));
const GL = '▓▒░#@$%&01/\\<>', sleep = ms => new Promise(r => setTimeout(r, ms));
async function decode(){
  const pre = document.getElementById('logo'), w = LINES[0].length;
  for (let f = 0; f <= 34; f++){
    const reveal = (w + 4) * f / 30;
    pre.textContent = LINES.map(l => [...l].map((ch, i) => ch === ' ' ? ' ' : i < reveal ? ch : (Math.random() < .55 ? GL[Math.random() * GL.length | 0] : ' ')).join('')).join('\n');
    await sleep(34);
  }
}
// the line the user wrote in the demo (?line=...), as plain text only; a default when there is none
const LINE = (new URLSearchParams(location.search).get('line') || '').replace(/[\u0000-\u001f\u007f]/g, '').replace(/\s+/g, ' ').trim().slice(0, 80)
  || 'everything is connected.';
async function type(){
  const el = document.getElementById('line'), txt = document.createElement('span');
  el.replaceChildren(txt, document.createElement('i'));
  for (let i = 1; i <= LINE.length; i++){ txt.textContent = LINE.slice(0, i); await sleep(/[.,!?]/.test(LINE[i - 1]) ? 380 : 55); }
}
const c = document.getElementById('c'), g = c.getContext('2d');
let W, H; const fit = () => { W = c.width = innerWidth; H = c.height = innerHeight; }; fit(); addEventListener('resize', fit);
function frame(now){
  const t = now / 1000;
  g.fillStyle = `rgba(${BG},.35)`; g.fillRect(0, 0, W, H);
  g.lineWidth = 1.1;
  for (let i = 0; i < 6; i++){
    const y0 = 26 + i * 13, sag = 70 + i * 9 + Math.sin(t * .35) * 4 * (1 + i * .3);
    g.strokeStyle = `rgba(${FG},${.07 + i * .012})`;
    g.beginPath(); g.moveTo(-30, y0); g.quadraticCurveTo(W * .42, y0 + sag, W + 30, y0 - 30 + i * 6); g.stroke();
  }
  for (let i = 0; i < 3; i++){        // the hub rings, idling under the greeting
    const r = 30 + i * 13, a0 = t * (.35 + i * .22) * (i % 2 ? -1 : 1);
    g.strokeStyle = `rgba(${RED},${.35 - i * .08})`;
    g.beginPath(); g.arc(W / 2, H - 110, r, a0, a0 + Math.PI * (1.1 + i * .3)); g.stroke();
  }
  if (Math.random() < .15){ const y = Math.random() * H; g.fillStyle = 'rgba(255,255,255,.035)'; g.fillRect(0, y, W, 1); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
setInterval(() => {
  const n = new Date(), p = v => String(v).padStart(2, '0');
  document.getElementById('d').textContent = `${n.getFullYear()}.${p(n.getMonth() + 1)}.${p(n.getDate())}`;
  document.getElementById('t').textContent = n.toTimeString().slice(0, 8);
}, 500);
let ac = null;
document.getElementById('con').onclick = e => {
  if (ac){ ac.state === 'running' ? ac.suspend() : ac.resume(); e.target.textContent = ac.state === 'running' ? 'CONNECT // SOUND' : 'DISCONNECT'; return; }
  ac = new (window.AudioContext || window.webkitAudioContext)();
  const master = ac.createGain(); master.gain.value = .5; master.connect(ac.destination);
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 220;
  const hum = ac.createGain(); hum.gain.value = .06; lp.connect(hum); hum.connect(master);
  [50, 100.4, 149.7].forEach((f, i) => { const o = ac.createOscillator(); o.type = i ? 'sine' : 'sawtooth'; o.frequency.value = f; o.connect(lp); o.start(); });
  [220, 277, 330, 440].forEach((f, i) => { const o = ac.createOscillator(), v = ac.createGain(); o.frequency.value = f; v.gain.setValueAtTime(.05, ac.currentTime + i * .12);
    v.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + i * .12 + 2.4); o.connect(v); v.connect(master); o.start(ac.currentTime + i * .12); o.stop(ac.currentTime + i * .12 + 2.5); });
  e.target.textContent = 'DISCONNECT';
};
(async () => { await decode(); await sleep(300); await type(); })();
</script>
</body>
</html>
