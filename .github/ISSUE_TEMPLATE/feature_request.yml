name: An idea
description: Something NAVI could do, or do better
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The task or situation, and where NAVI gets in the way or falls short.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Councils and agents, Engines and models, The browser interface, The terminal (TUI), The guard and safety, Something else]
